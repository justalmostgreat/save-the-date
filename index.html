<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gabrielle &amp; Ernesto · Reserva la Fecha</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#f8e8cf">
<meta property="og:title" content="Gabrielle &amp; Ernesto · Reserva la Fecha">
<meta property="og:description" content="Abre para revelar">
<meta property="og:type" content="website">
<meta property="og:image" content="https://justalmostgreat.github.io/save-the-date/images/save-og.jpg">
<meta property="og:image:width" content="941">
<meta property="og:image:height" content="494">
<meta property="og:url" content="https://justalmostgreat.github.io/save-the-date/">
<meta name="twitter:card" content="summary_large_image">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#f8e8cf;overflow:hidden;-webkit-tap-highlight-color:transparent}

  /* The stage is the art's own 941x1672 canvas scaled to fit the screen; every position below is % of that canvas. */
  .stage{--u:min(100vw / 941, 100vh / 1672);position:fixed;inset:0;margin:auto;
    width:calc(941*var(--u));height:calc(1672*var(--u));cursor:pointer;outline:none;touch-action:manipulation}
  @supports (height:100svh){.stage{--u:min(100vw / 941, 100svh / 1672)}}
  .stage img{position:absolute;left:0;top:0;width:100%;height:100%;
    user-select:none;-webkit-user-select:none;-webkit-user-drag:none}

  /* Layers, back to front: open envelope | card | envelope pocket (same art, clipped) | sealed envelope */
  .back{z-index:1}
  .front{z-index:3;clip-path:polygon(0 42.05%,6.06% 42.05%,33.48% 54.72%,44.85% 59.33%,47.29% 58.55%,49.73% 58.31%,
    52.18% 58.55%,54.62% 59.33%,67.06% 54.72%,93.94% 42.05%,100% 42.05%,100% 100%,0 100%)}
  /* nudged so its seal and envelope sit on the open art's, so the crossfade reads as opening in place */
  .sealed{z-index:4;transform-origin:49.95% 60.53%;transform:translate(-.21%,1.97%) scale(.97);transition:opacity .7s ease}
  .stage .card{z-index:2;left:3.24%;top:13.16%;width:93.52%;height:73.68%;border-radius:calc(12*var(--u));
    box-shadow:0 calc(16*var(--u)) calc(44*var(--u)) rgba(92,38,20,.3);transform:translateY(19.07%) scale(.5455)}

  .ring{position:absolute;z-index:5;left:49.73%;top:62.5%;width:16%;aspect-ratio:1;border-radius:50%;
    border:2px solid rgba(140,22,32,.6);pointer-events:none;animation:ring 2.4s ease-out infinite}
  @keyframes ring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.85)}75%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}

  .open{cursor:default}
  .open .ring{display:none}
  .open .sealed{opacity:0;pointer-events:none}
  /* card slides up out of the pocket, then (clear of it, so the z-index swap is invisible) comes forward to full size */
  .open .card{animation:pull 2.5s cubic-bezier(.45,0,.25,1) .9s both}
  @keyframes pull{
    51.9%{z-index:2}
    52%{z-index:5;transform:translateY(-32.47%) scale(.5455);animation-timing-function:cubic-bezier(.3,0,.15,1)}
    100%{z-index:5;transform:none}
  }
  .open .back,.open .front{animation:drop 2.5s cubic-bezier(.45,0,.25,1) .9s both}
  @keyframes drop{
    52%{transform:translateY(5.38%);opacity:1;animation-timing-function:cubic-bezier(.4,0,.7,1)}
    100%{transform:translateY(17.94%);opacity:0}
  }

  /* feather the art's edges into the page colour: no seam at the letterbox or around the nudged sealed layer */
  .back,.front,.sealed{
    -webkit-mask-image:linear-gradient(90deg,#0000,#000 5%,#000 95%,#0000),linear-gradient(#0000,#000 3%,#000 97%,#0000);-webkit-mask-composite:source-in;
    mask-image:linear-gradient(90deg,#0000,#000 5%,#000 95%,#0000),linear-gradient(#0000,#000 3%,#000 97%,#0000);mask-composite:intersect}
  /* music: a little pill under the card that fades in as the card comes out */
  .music{position:fixed;z-index:10;left:0;right:0;bottom:16px;margin:0 auto;width:max-content;max-width:calc(100% - 32px);
    display:flex;align-items:center;gap:10px;padding:3px 6px 3px 3px;border-radius:999px;
    background:rgba(255,250,242,.92);border:1px solid rgba(140,22,32,.14);box-shadow:0 6px 20px rgba(92,38,20,.16);
    color:#8c1620;font:italic 15px/1.25 Georgia,'Times New Roman',serif;
    opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .6s ease 2.6s,transform .6s ease 2.6s,visibility 0s 2.6s}
  .music.on{opacity:1;visibility:visible;transform:none}
  .music button{flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:none;color:inherit;cursor:pointer}
  .music button:focus-visible{outline:2px solid #8c1620;outline-offset:2px}
  .music svg{display:block;fill:currentColor}
  .play,.play svg{width:44px;height:44px}
  .play .disc{fill:#8c1620}
  .play path{fill:#fdf3e3}
  /* the ring round the play button fills up as the song plays (128.8 = its circumference) */
  .play .groove,.play .arc{fill:none;stroke-width:2}
  .play .groove{stroke:rgba(140,22,32,.16)}
  .play .arc{stroke:#8c1620;stroke-dasharray:128.8;stroke-dashoffset:128.8;transition:stroke-dashoffset .3s linear}
  .music .pause-i,.music.playing .play-i{display:none}
  .music.playing .pause-i{display:inline}
  .next{width:36px;height:36px}
  .next svg{width:22px;height:22px}
  .song{min-width:0}
  .song:last-child{padding-right:14px}
  .song span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .song span+span{font:10.5px/1.45 Georgia,'Times New Roman',serif;letter-spacing:.12em;text-transform:uppercase;opacity:.75}

  @media (prefers-reduced-motion:reduce){
    .ring{animation:none;opacity:0}
    .open .card{animation:none;transform:none;z-index:5}
    .open .back,.open .front{animation:none;opacity:0}
    .music{transition:none;transform:none}
  }

</style>
</head>
<body>
  <main class="stage" id="stage" role="button" tabindex="0" aria-label="Abrir el sobre · Open the envelope">
    <img class="back" src="images/save-open.webp" alt="">
    <img class="card" src="images/save-card-final.webp" alt="Reserva la Fecha: Gabrielle y Ernesto, 5 de junio de 2027, Lagos de Moreno, Jalisco, México">
    <img class="front" src="images/save-open.webp" alt="">
    <img class="sealed" src="images/save-sealed.webp" alt="Reserva la Fecha. Abre para revelar." fetchpriority="high">
    <span class="ring"></span>
  </main>

  <div class="music" id="music" role="group" aria-label="Música · Music">
    <button class="play" id="play" type="button" aria-label="Reproducir música · Play music">
      <svg viewBox="0 0 44 44" aria-hidden="true">
        <circle class="groove" cx="22" cy="22" r="20.5"/>
        <circle class="arc" id="arc" cx="22" cy="22" r="20.5" transform="rotate(-90 22 22)"/>
        <circle class="disc" cx="22" cy="22" r="17"/>
        <path class="play-i" d="M18.5 15v14l11-7z"/>
        <path class="pause-i" d="M16.5 15h4v14h-4zM23.5 15h4v14h-4z"/>
      </svg>
    </button>
    <div class="song"><span id="title"></span><span id="artist"></span></div>
    <button class="next" id="next" type="button" aria-label="Siguiente canción · Next song">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6.5v11l8.5-5.5zM15.5 6.5h2.2v11h-2.2z"/></svg>
    </button>
  </div>
  <audio id="audio" preload="none"></audio>

<script>
  // The songs play in this order, then loop. Put the files in music/ and list them here.
  var SONGS=[
    {src:'music/cancion-1.mp3', title:'Nombre de la canción', artist:'Artista'},
    {src:'music/cancion-2.mp3', title:'Otra canción', artist:'Otro artista'}
  ];

  (function(){
    var s=document.getElementById('stage'),m=document.getElementById('music'),a=document.getElementById('audio'),
      play=document.getElementById('play'),next=document.getElementById('next'),arc=document.getElementById('arc'),
      n=0,started=false,resume=false;
    function go(){
      s.classList.add('open');
      if(SONGS.length) m.classList.add('on');
      // once open it is just a picture, so let screen readers reach the card's alt text
      s.removeAttribute('role'); s.removeAttribute('aria-label'); s.removeAttribute('tabindex');
    }
    function open(){
      // browsers only allow sound that a tap starts, so the music has to start in the opening tap itself, not after the wait below
      if(!started&&SONGS.length){ started=true; start(); }
      // an early tap waits for all the art (window load) so it never animates half-loaded images.
      // ponytail: not img.decode(), which can hang forever when the page isn't painting
      if(document.readyState==='complete') go(); else addEventListener('load',go);
    }
    s.addEventListener('click',open);
    s.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });

    function load(i){
      n=(i+SONGS.length)%SONGS.length;
      var song=SONGS[n];
      a.src=song.src;
      document.getElementById('title').textContent=song.title;
      document.getElementById('artist').textContent=song.artist;
      arc.style.strokeDashoffset='';
      // what the phone's lock screen / notification shows
      if('mediaSession' in navigator) navigator.mediaSession.metadata=new MediaMetadata({title:song.title,artist:song.artist,
        album:'Gabrielle & Ernesto · 5 de junio de 2027',artwork:[{src:'images/save-card-final.webp',sizes:'2120x2968',type:'image/webp'}]});
    }
    // if a browser still says no, the play button is right there
    function start(){ var p=a.play(); if(p) p.catch(function(){}); }
    function skip(d){ load(n+d); start(); }

    if(!SONGS.length) return;
    load(0);
    if(SONGS.length<2){ next.remove(); a.loop=true; }
    else{
      next.addEventListener('click',function(){ skip(1); });
      a.addEventListener('ended',function(){ skip(1); });
      if('mediaSession' in navigator) try{
        navigator.mediaSession.setActionHandler('nexttrack',function(){ skip(1); });
        navigator.mediaSession.setActionHandler('previoustrack',function(){ skip(-1); });
      }catch(e){}
    }
    play.addEventListener('click',function(){ if(a.paused) start(); else a.pause(); });
    a.addEventListener('play',function(){ m.classList.add('playing'); play.setAttribute('aria-label','Pausar música · Pause music'); });
    a.addEventListener('pause',function(){ m.classList.remove('playing'); play.setAttribute('aria-label','Reproducir música · Play music'); });
    a.addEventListener('timeupdate',function(){ if(a.duration) arc.style.strokeDashoffset=128.8*(1-a.currentTime/a.duration); });
    // pause when they leave (back to WhatsApp, screen locked) and carry on when they come back
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){ resume=!a.paused; a.pause(); } else if(resume) start();
    });
  })();
</script>
</body>
</html>
